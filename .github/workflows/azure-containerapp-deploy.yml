name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (service principal JSON)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Materialize deployment .env
        if: ${{ env.DEPLOY_ENV_FILE != '' }}
        run: |
          printf "%s\n" "$DEPLOY_ENV_FILE" > .env

      - name: Redeploy Container App
        env:
          AZ_RG: ${{ vars.AZ_RG }}
          AZ_LOCATION: ${{ vars.AZ_LOCATION }}
          AZ_ACR_NAME: ${{ vars.AZ_ACR_NAME }}
        run: |
          chmod +x ./scripts/build-image.sh ./scripts/azure-containerapp.sh
          ./scripts/azure-containerapp.sh redeploy
